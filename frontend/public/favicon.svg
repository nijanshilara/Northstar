<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ns-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle with subtle border -->
  <circle cx="24" cy="24" r="22" fill="#0f172a" />
  <circle cx="24" cy="24" r="22" stroke="url(#ns-grad)" stroke-width="1.5" opacity="0.4" />
  <!-- Compass dial dashed ring -->
  <circle cx="24" cy="24" r="16.5" stroke="url(#ns-grad)" stroke-width="1.2" stroke-dasharray="2.5 3.5" opacity="0.7" />
  <!-- Diagonal mini rays -->
  <path d="M24 14L26.2 21.8L34 24L26.2 26.2L24 34L21.8 26.2L14 24L21.8 21.8Z" fill="url(#ns-grad)" opacity="0.45" />
  <!-- Main 4-point North Star -->
  <path d="M24 5L26.8 19.8L41.6 22.6L26.8 25.4L24 40.2L21.2 25.4L6.4 22.6L21.2 19.8Z" fill="url(#ns-grad)" filter="url(#glow)" />
  <!-- Radiant Core -->
  <circle cx="24" cy="22.6" r="2.2" fill="#ffffff" />
</svg>