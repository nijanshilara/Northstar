<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Northstar — Your compass to everywhere. Intelligent trip planning, budget tracking, Splitwise expenses, and private travel memories." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Northstar — Your compass to everywhere</title>
    <!-- Blocking theme + palette initializer — runs before React paint to prevent flash -->
    <script>
      (function () {
        try {
          var VALID_THEMES = ['light', 'dark', 'colourful'];
          var VALID_PALETTES = ['ocean', 'sunset', 'tropical', 'lavender', 'rose', 'forest', 'custom'];

          /* ── Read stored preferences ── */
          var t = localStorage.getItem('ai-travel-theme') || 'light';
          if (VALID_THEMES.indexOf(t) === -1) t = 'light';

          var p = localStorage.getItem('ai-travel-palette') || 'ocean';
          if (VALID_PALETTES.indexOf(p) === -1) p = 'ocean';

          var customAccent = localStorage.getItem('ai-travel-custom-accent') || '#6366f1';

          /* ── Apply data-theme and Tailwind dark class ── */
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.documentElement.classList.add('dark');

          /* ── Apply colourful palette CSS custom properties ── */
          if (t === 'colourful') {
            /* Inline palette table — must stay in sync with ThemeContext.tsx PALETTES */
            var PALETTES = {
              ocean:    { accentFrom:'#0891b2', accentTo:'#0e7490', sidebarFrom:'#0c4a6e', sidebarTo:'#164e63', bodyFrom:'#f0f9ff', bodyMid:'#e0f7fa', bodyTo:'#ecfeff', cardBorder:'rgba(8,145,178,0.15)', titleFrom:'#0891b2', titleTo:'#0e7490', navText:'#7dd3fc', focusRing:'#38bdf8', badgeBg:'#e0f7fa', badgeText:'#0e7490', badgeBorder:'#a5f3fc' },
              sunset:   { accentFrom:'#f97316', accentTo:'#db2777', sidebarFrom:'#431407', sidebarTo:'#500724', bodyFrom:'#fff7ed', bodyMid:'#fdf2f8', bodyTo:'#fce7f3', cardBorder:'rgba(249,115,22,0.15)', titleFrom:'#ea580c', titleTo:'#db2777', navText:'#fca5a5', focusRing:'#fb923c', badgeBg:'#fff1f2', badgeText:'#be185d', badgeBorder:'#fecdd3' },
              tropical: { accentFrom:'#10b981', accentTo:'#06b6d4', sidebarFrom:'#022c22', sidebarTo:'#083344', bodyFrom:'#ecfdf5', bodyMid:'#e0fdfa', bodyTo:'#f0f9ff', cardBorder:'rgba(16,185,129,0.15)', titleFrom:'#10b981', titleTo:'#06b6d4', navText:'#6ee7b7', focusRing:'#34d399', badgeBg:'#ecfdf5', badgeText:'#047857', badgeBorder:'#a7f3d0' },
              lavender: { accentFrom:'#7c3aed', accentTo:'#a78bfa', sidebarFrom:'#2e1065', sidebarTo:'#1e1b4b', bodyFrom:'#f5f3ff', bodyMid:'#ede9fe', bodyTo:'#faf5ff', cardBorder:'rgba(124,58,237,0.15)', titleFrom:'#7c3aed', titleTo:'#a855f7', navText:'#c4b5fd', focusRing:'#a78bfa', badgeBg:'#f5f3ff', badgeText:'#6d28d9', badgeBorder:'#ddd6fe' },
              rose:     { accentFrom:'#e11d48', accentTo:'#be185d', sidebarFrom:'#4c0519', sidebarTo:'#3b0764', bodyFrom:'#fff1f2', bodyMid:'#fdf2f8', bodyTo:'#fae8ff', cardBorder:'rgba(225,29,72,0.15)', titleFrom:'#e11d48', titleTo:'#be185d', navText:'#fda4af', focusRing:'#fb7185', badgeBg:'#fff1f2', badgeText:'#9f1239', badgeBorder:'#fecdd3' },
              forest:   { accentFrom:'#166534', accentTo:'#15803d', sidebarFrom:'#052e16', sidebarTo:'#14532d', bodyFrom:'#f0fdf4', bodyMid:'#f7fee7', bodyTo:'#fefce8', cardBorder:'rgba(22,101,52,0.15)', titleFrom:'#166534', titleTo:'#15803d', navText:'#86efac', focusRing:'#4ade80', badgeBg:'#f0fdf4', badgeText:'#166534', badgeBorder:'#bbf7d0' },
            };

            var tokens;
            if (p === 'custom') {
              /* Simple darken helper for custom accent */
              var hex = (customAccent || '#6366f1').replace('#', '');
              if (hex.length === 3) hex = hex.split('').map(function(c){return c+c;}).join('');
              var n = parseInt(hex, 16);
              var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
              var darken = function(x, amt) { return Math.max(0, Math.round(x * (1 - amt))); };
              var toHex = function(r,g,b) {
                return '#' + [r,g,b].map(function(v){ return v.toString(16).padStart(2,'0'); }).join('');
              };
              var dark = toHex(darken(r,0.25), darken(g,0.25), darken(b,0.25));
              var veryDark = toHex(darken(r,0.6), darken(g,0.6), darken(b,0.6));
              var accent = '#' + hex;
              tokens = {
                accentFrom: accent, accentTo: dark,
                sidebarFrom: veryDark, sidebarTo: toHex(darken(r,0.45), darken(g,0.45), darken(b,0.45)),
                bodyFrom: '#f8f9fa', bodyMid: '#f3f4f6', bodyTo: '#f9fafb',
                cardBorder: accent + '26',
                titleFrom: accent, titleTo: dark,
                navText: '#e2e8f0', focusRing: accent,
                badgeBg: '#f8f9fa', badgeText: dark, badgeBorder: accent + '40',
              };
            } else {
              tokens = PALETTES[p] || PALETTES.ocean;
            }

            var root = document.documentElement;
            var props = {
              '--cp-accent-from': tokens.accentFrom,
              '--cp-accent-to':   tokens.accentTo,
              '--cp-sidebar-from':tokens.sidebarFrom,
              '--cp-sidebar-to':  tokens.sidebarTo,
              '--cp-body-from':   tokens.bodyFrom,
              '--cp-body-mid':    tokens.bodyMid,
              '--cp-body-to':     tokens.bodyTo,
              '--cp-card-border': tokens.cardBorder,
              '--cp-title-from':  tokens.titleFrom,
              '--cp-title-to':    tokens.titleTo,
              '--cp-nav-text':    tokens.navText,
              '--cp-focus-ring':  tokens.focusRing,
              '--cp-badge-bg':    tokens.badgeBg,
              '--cp-badge-text':  tokens.badgeText,
              '--cp-badge-border':tokens.badgeBorder,
            };
            for (var k in props) root.style.setProperty(k, props[k]);
          }
        } catch (e) {
          /* Storage or parsing error — silently fall back to light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
